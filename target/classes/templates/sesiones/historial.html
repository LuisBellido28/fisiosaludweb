<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Historial Clínico</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head><body>
<nav class="navbar navbar-dark bg-primary px-3">
  <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <div class="d-flex gap-2">
    <a href="/pacientes" class="btn btn-light btn-sm">Pacientes</a>
    <a href="/reservas" class="btn btn-light btn-sm">Reservas</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
      <button class="btn btn-outline-light btn-sm">Salir</button>
    </form>
  </div>
</nav>
<div class="container-fluid px-4 py-3">
  <h4 class="mb-3"><i class="bi bi-clock-history me-2 text-primary"></i>Historial Clínico por Paciente</h4>
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <form class="row g-2" method="get">
        <div class="col-md-5">
          <label class="form-label">Seleccionar paciente</label>
          <select name="pacienteId" class="form-select">
            <option value="">— Seleccionar paciente —</option>
            <option th:each="p : ${pacientes}" th:value="${p.id}"
                    th:text="${p.nombre + ' ' + p.apellido + ' - DNI: ' + p.dni}"
                    th:selected="${p.id == pacienteId}"></option>
          </select>
        </div>
        <div class="col-auto align-self-end">
          <button class="btn btn-primary"><i class="bi bi-search me-1"></i>Ver historial</button>
        </div>
      </form>
    </div>
  </div>

  <div th:if="${pacienteSeleccionado != null}" class="alert alert-info">
    <strong>Paciente:</strong> <span th:text="${pacienteSeleccionado.nombreCompleto}"></span>
    &nbsp;|&nbsp; <strong>DNI:</strong> <span th:text="${pacienteSeleccionado.dni}"></span>
    &nbsp;|&nbsp; <strong>Diagnóstico:</strong> <span th:text="${pacienteSeleccionado.diagnosticoMedico}"></span>
  </div>

  <div th:if="${sesiones != null}">
    <div th:if="${#lists.isEmpty(sesiones)}" class="alert alert-warning">
      No hay sesiones registradas para este paciente.
    </div>
    <div th:each="s, i : ${sesiones}" class="card shadow-sm mb-3">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-bold"><i class="bi bi-calendar3 me-2"></i>Sesión #<span th:text="${i.count}"></span>
          &nbsp;–&nbsp; <span th:text="${s.fechaSesion}"></span></span>
        <span class="badge bg-success fs-6">S/. <span th:text="${#numbers.formatDecimal(s.montoCobrado,1,2)}"></span></span>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <p><strong><i class="bi bi-person-badge me-1"></i>Fisioterapeuta:</strong>
              <span th:text="${s.reserva.fisioterapeuta.nombreCompleto}"></span></p>
            <p><strong><i class="bi bi-clipboard2 me-1"></i>Tipo de terapia:</strong>
              <span class="badge bg-info text-dark" th:text="${s.reserva.tipoTerapia}"></span></p>
          </div>
          <div class="col-md-6">
            <p><strong><i class="bi bi-journal-text me-1"></i>Observaciones:</strong><br/>
              <span th:text="${s.observaciones}"></span></p>
            <p><strong><i class="bi bi-graph-up me-1"></i>Evolución:</strong><br/>
              <span th:text="${s.evolucion}"></span></p>
          </div>
        </div>
        <div th:if="${not #lists.isEmpty(s.detalles)}">
          <strong><i class="bi bi-box-seam me-1"></i>Equipos/Insumos utilizados:</strong>
          <ul class="list-unstyled mt-1">
            <li th:each="d : ${s.detalles}" class="ms-3">
              <i class="bi bi-dot"></i>
              <span th:text="${d.equipoInsumo.nombre + ' – Cant: ' + d.cantidadUsada}"></span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
