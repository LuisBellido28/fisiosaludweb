<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Registrar Sesión</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head><body class="bg-light">
<nav class="navbar navbar-dark bg-success px-3 mb-4">
  <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <a href="/reservas" class="btn btn-outline-light btn-sm">← Volver a Reservas</a>
</nav>
<div class="container" style="max-width:800px">
  <div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span></div>
  <div class="card shadow">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0"><i class="bi bi-clipboard2-pulse me-2"></i>Registro de Sesión de Fisioterapia</h5>
    </div>
    <div class="card-body">
      <!-- Info de la reserva -->
      <div class="alert alert-info mb-3">
        <div class="row">
          <div class="col-md-4"><strong>Paciente:</strong><br/>
            <span th:text="${reserva.paciente.nombre + ' ' + reserva.paciente.apellido}"></span></div>
          <div class="col-md-4"><strong>Fisioterapeuta:</strong><br/>
            <span th:text="${reserva.fisioterapeuta.nombre + ' ' + reserva.fisioterapeuta.apellido}"></span></div>
          <div class="col-md-4"><strong>Terapia / Fecha:</strong><br/>
            <span th:text="${reserva.tipoTerapia}"></span> –
            <span th:text="${#temporals.format(reserva.fechaHora, 'dd/MM/yyyy HH:mm')}"></span></div>
        </div>
      </div>

      <form th:action="@{/sesiones/guardar}" method="post">
        <input type="hidden" name="reservaId" th:value="${reserva.id}"/>

        <div class="mb-3">
          <label class="form-label fw-semibold">Observaciones clínicas *</label>
          <textarea name="observaciones" class="form-control" rows="3" required
                    placeholder="Describe las observaciones de la sesión..."></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Evolución del paciente *</label>
          <textarea name="evolucion" class="form-control" rows="3" required
                    placeholder="Describe la evolución y respuesta del paciente al tratamiento..."></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Monto cobrado S/. *</label>
          <input type="number" name="montoCobrado" class="form-control" step="0.01" min="0"
                 style="max-width:200px" required/>
        </div>

        <hr/>
        <h6 class="fw-semibold mb-3"><i class="bi bi-box-seam me-2"></i>Equipos e Insumos utilizados</h6>
        <div id="equipos-container">
          <div class="row g-2 mb-2 equipo-row">
            <div class="col-md-8">
              <select name="equipoIds" class="form-select">
                <option value="">— Sin equipo/insumo —</option>
                <option th:each="e : ${equipos}" th:value="${e.id}"
                        th:text="${e.nombre + ' [' + e.tipo + '] - Stock: ' + e.cantidad}"></option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="number" name="cantidades" class="form-control" placeholder="Cantidad" min="1" value="1"/>
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="agregarFila()">
          <i class="bi bi-plus-circle me-1"></i>Agregar equipo/insumo
        </button>

        <hr/>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success btn-lg">
            <i class="bi bi-check-circle me-2"></i>Registrar Sesión
          </button>
          <a href="/reservas" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const equiposHtml = document.querySelector('.equipo-row').innerHTML;
function agregarFila() {
  const container = document.getElementById('equipos-container');
  const div = document.createElement('div');
  div.className = 'row g-2 mb-2 equipo-row';
  div.innerHTML = equiposHtml;
  container.appendChild(div);
}
</script>
</body></html>
