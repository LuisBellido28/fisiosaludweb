<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"/><title>Fisioterapeutas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head><body>
<nav class="navbar navbar-dark bg-primary px-3">
  <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <div class="d-flex gap-2">
    <a href="/pacientes" class="btn btn-light btn-sm">Pacientes</a>
    <a href="/fisioterapeutas" class="btn btn-light btn-sm">Fisios</a>
    <a href="/equipos" class="btn btn-light btn-sm">Equipos</a>
    <a href="/reservas" class="btn btn-light btn-sm">Reservas</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
      <button class="btn btn-outline-light btn-sm">Salir</button>
    </form>
  </div>
</nav>
<div class="container-fluid px-4 py-3">
  <div th:if="${msg}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${msg}"></span></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-person-badge me-2 text-success"></i>Gestión de Fisioterapeutas</h4>
    <a href="/fisioterapeutas/nuevo" class="btn btn-success"><i class="bi bi-plus me-2"></i>Nuevo Fisioterapeuta</a>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-success">
          <tr><th>N.°</th><th>Nombre completo</th><th>CMP</th><th>Especialidad</th><th>Turno</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(fisioterapeutas)}">
            <td colspan="8" class="text-center text-muted py-4">No hay fisioterapeutas registrados.</td>
          </tr>
          <tr th:each="f, i : ${fisioterapeutas}">
            <td th:text="${i.count}"></td>
            <td class="fw-semibold" th:text="${f.nombre + ' ' + f.apellido}"></td>
            <td th:text="${f.cmp}"></td>
            <td><span class="badge bg-info text-dark" th:text="${f.especialidad}"></span></td>
            <td th:text="${f.turno}"></td>
            <td th:text="${f.telefono}"></td>
            <td>
              <span th:if="${f.activo}" class="badge bg-success">Activo</span>
              <span th:unless="${f.activo}" class="badge bg-secondary">Baja</span>
            </td>
            <td>
              <a th:href="@{/fisioterapeutas/editar/{id}(id=${f.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
              <a th:href="@{/fisioterapeutas/baja/{id}(id=${f.id})}" class="btn btn-sm btn-outline-danger"
                 th:if="${f.activo}" onclick="return confirm('¿Dar de baja?')"><i class="bi bi-x-circle"></i></a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
