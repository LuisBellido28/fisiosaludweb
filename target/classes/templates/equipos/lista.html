<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"/><title>Equipos e Insumos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head><body>
<nav class="navbar navbar-dark bg-primary px-3">
  <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <div class="d-flex gap-2">
    <a href="/pacientes" class="btn btn-light btn-sm">Pacientes</a>
    <a href="/fisioterapeutas" class="btn btn-light btn-sm">Fisios</a>
    <a href="/equipos" class="btn btn-light btn-sm">Equipos</a>
    <a href="/reservas" class="btn btn-light btn-sm">Reservas</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
      <button class="btn btn-outline-light btn-sm">Salir</button>
    </form>
  </div>
</nav>
<div class="container-fluid px-4 py-3">
  <div th:if="${msg}" class="alert alert-success"><span th:text="${msg}"></span></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-box-seam me-2 text-warning"></i>Equipos e Insumos de Terapia</h4>
    <a href="/equipos/nuevo" class="btn btn-warning"><i class="bi bi-plus me-2"></i>Nuevo Equipo/Insumo</a>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-warning">
          <tr><th>N.°</th><th>Nombre</th><th>Tipo</th><th>Cantidad</th><th>Mín.</th><th>Estado</th><th>Costo S/.</th><th>Stock</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(equipos)}">
            <td colspan="9" class="text-center text-muted py-4">No hay registros.</td>
          </tr>
          <tr th:each="e, i : ${equipos}">
            <td th:text="${i.count}"></td>
            <td class="fw-semibold" th:text="${e.nombre}"></td>
            <td><span th:if="${e.tipo == 'EQUIPO'}" class="badge bg-primary">Equipo</span>
                <span th:if="${e.tipo == 'INSUMO'}" class="badge bg-secondary">Insumo</span></td>
            <td class="fw-bold" th:text="${e.cantidad}"></td>
            <td th:text="${e.cantidadMinima}"></td>
            <td><span th:if="${e.estado == 'DISPONIBLE'}" class="badge bg-success">Disponible</span>
                <span th:unless="${e.estado == 'DISPONIBLE'}" class="badge bg-danger">Mantenimiento</span></td>
            <td th:text="${#numbers.formatDecimal(e.costoUso, 1, 2)}"></td>
            <td>
              <span th:if="${e.stockBajo}" class="badge bg-danger"><i class="bi bi-exclamation-triangle me-1"></i>Stock bajo</span>
              <span th:unless="${e.stockBajo}" class="badge bg-success"><i class="bi bi-check-circle me-1"></i>OK</span>
            </td>
            <td>
              <a th:href="@{/equipos/editar/{id}(id=${e.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
              <a th:href="@{/equipos/baja/{id}(id=${e.id})}" class="btn btn-sm btn-outline-danger"
                 onclick="return confirm('¿Dar de baja?')"><i class="bi bi-x-circle"></i></a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
