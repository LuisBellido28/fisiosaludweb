<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title th:text="${titulo}">Paciente</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head><body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-3 mb-4">
  <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <a href="/pacientes" class="btn btn-outline-light btn-sm">← Volver a Pacientes</a>
</nav>
<div class="container" style="max-width:700px">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0"><i class="bi bi-person-heart me-2"></i><span th:text="${titulo}"></span></h5>
    </div>
    <div class="card-body">
      <form th:action="@{/pacientes/guardar}" method="post" th:object="${paciente}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{activo}"/>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nombre *</label>
            <input type="text" th:field="*{nombre}" class="form-control" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Apellido *</label>
            <input type="text" th:field="*{apellido}" class="form-control" required/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">DNI *</label>
            <input type="text" th:field="*{dni}" class="form-control" maxlength="8" required/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Fecha de nacimiento</label>
            <input type="date" th:field="*{fechaNacimiento}" class="form-control"/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control"/>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Correo electrónico</label>
            <input type="email" th:field="*{correo}" class="form-control"/>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Diagnóstico médico de derivación</label>
            <textarea th:field="*{diagnosticoMedico}" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <hr/>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Guardar</button>
          <a href="/pacientes" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
