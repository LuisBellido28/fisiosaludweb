<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Login - FisioSalud</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg" style="width:400px">
    <div class="card-header bg-primary text-white text-center py-4">
      <i class="bi bi-heart-pulse-fill fs-1 d-block mb-2"></i>
      <h4 class="mb-0 fw-bold">FisioSalud S.A.C.</h4>
      <small>Sistema de Gestión Fisioterapéutica</small>
    </div>
    <div class="card-body p-4">
      <div th:if="${param.error}" class="alert alert-danger py-2">
        <i class="bi bi-exclamation-triangle me-1"></i> Usuario o contraseña incorrectos.
      </div>
      <div th:if="${param.logout}" class="alert alert-info py-2">
        <i class="bi bi-check-circle me-1"></i> Sesión cerrada correctamente.
      </div>
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="admin / fisio1 / recep1" required/>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </button>
      </form>
      <hr/>
      <small class="text-muted d-block text-center">
        admin/admin123 &nbsp;|&nbsp; fisio1/fisio123 &nbsp;|&nbsp; recep1/recep123
      </small>
    </div>
  </div>
</div>
</body>
</html>
