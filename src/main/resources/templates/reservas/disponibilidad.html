<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Disponibilidad</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head><body>
<nav class="navbar navbar-dark bg-primary px-3">
  <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <a href="/reservas" class="btn btn-outline-light btn-sm">← Reservas</a>
</nav>
<div class="container-fluid px-4 py-3">
  <h4 class="mb-3"><i class="bi bi-search me-2 text-primary"></i>Disponibilidad de Fisioterapeutas</h4>
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <form class="row g-2" method="get">
        <div class="col-md-3">
          <label class="form-label">Seleccionar fecha</label>
          <input type="date" name="fecha" class="form-control" th:value="${fecha}"/>
        </div>
        <div class="col-auto align-self-end">
          <button class="btn btn-primary"><i class="bi bi-search me-1"></i>Consultar</button>
        </div>
      </form>
    </div>
  </div>
  <div class="row">
    <div class="col-md-8">
      <h6 class="text-muted">Reservas para el <strong th:text="${fecha}"></strong></h6>
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-primary">
              <tr><th>Hora</th><th>Paciente</th><th>Fisioterapeuta</th><th>Terapia</th><th>Estado</th></tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(reservas)}">
                <td colspan="5" class="text-center text-muted py-4">No hay reservas para esta fecha.</td>
              </tr>
              <tr th:each="r : ${reservas}">
                <td class="fw-bold" th:text="${#temporals.format(r.fechaHora, 'HH:mm')}"></td>
                <td th:text="${r.paciente.nombre + ' ' + r.paciente.apellido}"></td>
                <td th:text="${r.fisioterapeuta.nombre + ' ' + r.fisioterapeuta.apellido}"></td>
                <td><span class="badge bg-info text-dark" th:text="${r.tipoTerapia}"></span></td>
                <td><span class="badge bg-warning text-dark" th:text="${r.estado}"></span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <h6 class="text-muted">Fisioterapeutas activos</h6>
      <div class="list-group shadow-sm">
        <div th:each="f : ${fisioterapeutas}" class="list-group-item">
          <div class="fw-semibold" th:text="${f.nombre + ' ' + f.apellido}"></div>
          <small class="text-muted" th:text="${f.especialidad + ' | ' + f.turno}"></small>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
