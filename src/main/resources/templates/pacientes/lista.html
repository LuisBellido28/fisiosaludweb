<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"/><title>Pacientes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head><body>
<nav class="navbar navbar-dark bg-primary px-3">
  <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <div class="d-flex gap-2">
    <a href="/pacientes" class="btn btn-light btn-sm">Pacientes</a>
    <a href="/fisioterapeutas" class="btn btn-light btn-sm">Fisios</a>
    <a href="/equipos" class="btn btn-light btn-sm">Equipos</a>
    <a href="/reservas" class="btn btn-light btn-sm">Reservas</a>
    <a href="/sesiones/historial" class="btn btn-light btn-sm">Historial</a>
    <a href="/reportes" class="btn btn-light btn-sm" sec:authorize="hasRole('ADMIN')">Reportes</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
      <button class="btn btn-outline-light btn-sm">Salir</button>
    </form>
  </div>
</nav>
<div class="container-fluid px-4 py-3">
  <div th:if="${msg}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${msg}"></span></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-person-heart me-2 text-primary"></i>Gestión de Pacientes</h4>
    <a href="/pacientes/nuevo" class="btn btn-primary"><i class="bi bi-person-plus me-2"></i>Nuevo Paciente</a>
  </div>
  <form class="row g-2 mb-3" method="get">
    <div class="col-md-5">
      <input type="text" name="q" class="form-control" placeholder="Buscar por nombre, apellido o DNI..." th:value="${q}"/>
    </div>
    <div class="col-auto">
      <button class="btn btn-outline-primary"><i class="bi bi-search me-1"></i>Buscar</button>
      <a href="/pacientes" class="btn btn-outline-secondary ms-1">Limpiar</a>
    </div>
  </form>
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-primary">
          <tr><th>N.°</th><th>Nombre completo</th><th>DNI</th><th>F. Nacimiento</th><th>Teléfono</th><th>Diagnóstico</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(pacientes)}">
            <td colspan="8" class="text-center text-muted py-4">No hay pacientes registrados.</td>
          </tr>
          <tr th:each="p, i : ${pacientes}">
            <td th:text="${i.count}"></td>
            <td class="fw-semibold" th:text="${p.nombre + ' ' + p.apellido}"></td>
            <td th:text="${p.dni}"></td>
            <td th:text="${p.fechaNacimiento}"></td>
            <td th:text="${p.telefono}"></td>
            <td><small th:text="${#strings.abbreviate(p.diagnosticoMedico, 40)}"></small></td>
            <td>
              <span th:if="${p.activo}" class="badge bg-success">Activo</span>
              <span th:unless="${p.activo}" class="badge bg-secondary">Baja</span>
            </td>
            <td>
              <a th:href="@{/pacientes/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning me-1">
                <i class="bi bi-pencil"></i>
              </a>
              <a th:href="@{/sesiones/historial(pacienteId=${p.id})}" class="btn btn-sm btn-outline-info me-1"
                 title="Ver historial">
                <i class="bi bi-clock-history"></i>
              </a>
              <a th:href="@{/pacientes/baja/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger"
                 th:if="${p.activo}"
                 onclick="return confirm('¿Dar de baja a este paciente?')">
                <i class="bi bi-person-x"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
