<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title th:text="${titulo}">Fisioterapeuta</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head><body class="bg-light">
<nav class="navbar navbar-dark bg-success px-3 mb-4">
  <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <a href="/fisioterapeutas" class="btn btn-outline-light btn-sm">← Volver</a>
</nav>
<div class="container" style="max-width:600px">
  <div class="card shadow">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i><span th:text="${titulo}"></span></h5>
    </div>
    <div class="card-body">
      <form th:action="@{/fisioterapeutas/guardar}" method="post" th:object="${fisioterapeuta}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{activo}"/>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label fw-semibold">Nombre *</label>
            <input type="text" th:field="*{nombre}" class="form-control" required/></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Apellido *</label>
            <input type="text" th:field="*{apellido}" class="form-control" required/></div>
          <div class="col-md-6"><label class="form-label fw-semibold">CMP (Colegiatura) *</label>
            <input type="text" th:field="*{cmp}" class="form-control" required/></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control"/></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Especialidad *</label>
            <select th:field="*{especialidad}" class="form-select" required>
              <option value="">Seleccionar...</option>
              <option th:each="e : ${especialidades}" th:value="${e}" th:text="${e}"></option>
            </select></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Turno *</label>
            <select th:field="*{turno}" class="form-select" required>
              <option value="">Seleccionar...</option>
              <option th:each="t : ${turnos}" th:value="${t}" th:text="${t}"></option>
            </select></div>
        </div>
        <hr/>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success"><i class="bi bi-save me-2"></i>Guardar</button>
          <a href="/fisioterapeutas" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
