<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titulo != null ? titulo + ' | FisioSalud' : 'FisioSalud S.A.C.'}">FisioSalud</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/dashboard">
      <i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud S.A.C.
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/pacientes}"><i class="bi bi-person-heart me-1"></i>Pacientes</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/fisioterapeutas}"><i class="bi bi-person-badge me-1"></i>Fisioterapeutas</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/equipos}"><i class="bi bi-box-seam me-1"></i>Equipos/Insumos</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/reservas}"><i class="bi bi-calendar-check me-1"></i>Reservas</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/sesiones/historial}"><i class="bi bi-clock-history me-1"></i>Historial</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/reportes}"><i class="bi bi-file-earmark-pdf me-1"></i>Reportes</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">Usuario</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <form th:action="@{/logout}" method="post">
                <button class="dropdown-item text-danger" type="submit">
                  <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                </button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-3">
  <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i><span th:text="${msg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <th:block th:fragment="content"></th:block>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
