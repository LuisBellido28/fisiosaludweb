<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title th:text="${titulo}">Equipo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head><body class="bg-light">
<nav class="navbar navbar-dark bg-warning px-3 mb-4">
  <a class="navbar-brand fw-bold text-dark" href="/dashboard"><i class="bi bi-heart-pulse-fill me-2"></i>FisioSalud</a>
  <a href="/equipos" class="btn btn-outline-dark btn-sm">← Volver</a>
</nav>
<div class="container" style="max-width:600px">
  <div class="card shadow">
    <div class="card-header bg-warning">
      <h5 class="mb-0"><i class="bi bi-box-seam me-2"></i><span th:text="${titulo}"></span></h5>
    </div>
    <div class="card-body">
      <form th:action="@{/equipos/guardar}" method="post" th:object="${equipo}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{activo}"/>
        <div class="row g-3">
          <div class="col-12"><label class="form-label fw-semibold">Nombre *</label>
            <input type="text" th:field="*{nombre}" class="form-control" required/></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Tipo *</label>
            <select th:field="*{tipo}" class="form-select" required>
              <option value="">Seleccionar...</option>
              <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select></div>
          <div class="col-md-6"><label class="form-label fw-semibold">Estado *</label>
            <select th:field="*{estado}" class="form-select" required>
              <option value="">Seleccionar...</option>
              <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
            </select></div>
          <div class="col-md-4"><label class="form-label fw-semibold">Cantidad</label>
            <input type="number" th:field="*{cantidad}" class="form-control" min="0"/></div>
          <div class="col-md-4"><label class="form-label fw-semibold">Cantidad mínima</label>
            <input type="number" th:field="*{cantidadMinima}" class="form-control" min="0"/></div>
          <div class="col-md-4"><label class="form-label fw-semibold">Costo por uso S/.</label>
            <input type="number" step="0.01" th:field="*{costoUso}" class="form-control" min="0"/></div>
        </div>
        <hr/>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning"><i class="bi bi-save me-2"></i>Guardar</button>
          <a href="/equipos" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
